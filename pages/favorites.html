<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorites | TravelAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#0066FF', accent: '#FF385C', dark: '#1D1D1F' },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-[#F5F5F7] text-dark font-sans min-h-screen page-fade-in">

    <nav id="navbar" class="sticky top-0 z-50 py-4 px-6"></nav>

    <main class="container mx-auto px-6 py-16">
        <header class="mb-16">
            <h1 class="text-5xl font-black mb-4">My <span class="text-accent">Favorites</span></h1>
            <p class="text-gray-400 font-bold">All your dream destinations and luxury stays in one place.</p>
        </header>

        <div id="favorites-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
            <!-- Dynamic Content -->
        </div>

        <div id="empty-state" class="hidden text-center py-32 space-y-8">
            <div class="w-24 h-24 bg-red-50 text-accent rounded-full flex items-center justify-center mx-auto">
                <i data-lucide="heart" class="w-12 h-12"></i>
            </div>
            <div>
                <h3 class="text-2xl font-black mb-2">No favorites yet</h3>
                <p class="text-gray-400 font-bold">Start exploring and click the heart icon to save what you love.</p>
            </div>
            <a href="destination.html" class="inline-block px-10 py-5 bg-dark text-white rounded-full font-black hover:bg-primary transition-all">Explore Destinations</a>
        </div>
    </main>

    <script src="../data/destinations.js"></script>
    <script src="../components/navbar.js"></script>
    <script src="../components/cards.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Navbar.render('favorites');
            renderFavorites();
        });

        function renderFavorites() {
            const favorites = JSON.parse(localStorage.getItem('favorites')) || [];
            const grid = document.getElementById('favorites-grid');
            const empty = document.getElementById('empty-state');

            if (favorites.length === 0) {
                grid.classList.add('hidden');
                empty.classList.remove('hidden');
                lucide.createIcons();
                return;
            }

            const favoriteDests = DESTINATIONS.filter(d => favorites.includes(d.id));
            grid.innerHTML = favoriteDests.map(d => Cards.createDestinationCard(d)).join('');
            lucide.createIcons();
        }

        // Override toggleFavorite to re-render
        const originalToggle = window.toggleFavorite;
        window.toggleFavorite = (id) => {
            let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('favorites', JSON.stringify(favorites));
            renderFavorites();
        };
    </script>
</body>
</html>
