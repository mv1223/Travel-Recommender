<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Hotels | TravelAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#0066FF', accent: '#FF385C', dark: '#1D1D1F' },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-[#F5F5F7] dark:bg-dark text-dark dark:text-white font-sans min-h-screen page-fade-in">

    <nav id="navbar" class="sticky top-0 z-50 py-4 px-6"></nav>

    <main class="container mx-auto px-6 py-16">
        <header class="mb-16">
            <h1 class="text-5xl font-black mb-4">Luxury <span class="text-primary">Stays</span></h1>
            <p class="text-gray-400 font-bold">Curated world-class hotels for the elite explorer.</p>
            
            <div class="mt-12 flex flex-col md:flex-row gap-4">
                <div class="flex-1 relative">
                    <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                    <input type="text" id="hotel-search" placeholder="Search by hotel name or city..." 
                           class="w-full pl-14 pr-6 py-5 rounded-3xl bg-white dark:bg-white/5 border-none focus:ring-2 focus:ring-primary shadow-sm font-bold">
                </div>
                <div class="flex gap-2">
                    <select id="price-filter" class="px-8 py-5 rounded-3xl bg-white dark:bg-white/5 border-none shadow-sm font-bold focus:ring-2 focus:ring-primary appearance-none pr-12">
                        <option value="all">Any Price</option>
                        <option value="low">Under $300</option>
                        <option value="mid">$300 - $700</option>
                        <option value="high">$700+</option>
                    </select>
                </div>
            </div>
        </header>

        <div id="hotels-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            <!-- Dynamic Content -->
        </div>

        <div id="no-hotels" class="hidden text-center py-20">
            <h3 class="text-2xl font-black text-gray-400">No hotels match your criteria.</h3>
        </div>
    </main>

    <script src="../data/app_state.js"></script>
    <script src="../data/hotels.js"></script>
    <script src="../components/navbar.js"></script>
    <script src="../script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Navbar.render('hotels');
            renderHotels();
            
            document.getElementById('hotel-search').addEventListener('input', renderHotels);
            document.getElementById('price-filter').addEventListener('change', renderHotels);
        });

        function renderHotels() {
            const grid = document.getElementById('hotels-grid');
            const noHotels = document.getElementById('no-hotels');
            const query = document.getElementById('hotel-search').value.toLowerCase();
            const price = document.getElementById('price-filter').value;

            const filtered = HOTELS.filter(h => {
                const matchesSearch = h.name.toLowerCase().includes(query) || h.city.toLowerCase().includes(query);
                const matchesPrice = price === 'all' || 
                    (price === 'low' && h.price < 300) ||
                    (price === 'mid' && h.price >= 300 && h.price <= 700) ||
                    (price === 'high' && h.price > 700);
                return matchesSearch && matchesPrice;
            });

            if (filtered.length === 0) {
                grid.classList.add('hidden');
                noHotels.classList.remove('hidden');
            } else {
                grid.classList.remove('hidden');
                noHotels.classList.add('hidden');
                grid.innerHTML = filtered.map(hotel => `
                    <div class="group bg-white dark:bg-white/5 rounded-[40px] overflow-hidden shadow-sm hover:shadow-2xl transition-all duration-500 border border-gray-100 dark:border-white/10 card-hover">
                        <div class="relative h-64 overflow-hidden">
                            <img src="${hotel.image}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                            <div class="absolute top-5 right-5 px-4 py-2 bg-white/90 backdrop-blur-md rounded-2xl text-[10px] font-black uppercase tracking-widest text-primary">
                                ${hotel.category}
                            </div>
                        </div>
                        <div class="p-8">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <h3 class="text-2xl font-black mb-1">${hotel.name}</h3>
                                    <p class="text-gray-400 font-bold text-sm flex items-center gap-2">
                                        <i data-lucide="map-pin" class="w-4 h-4"></i> ${hotel.city}
                                    </p>
                                </div>
                                <div class="flex items-center gap-1 bg-yellow-50 dark:bg-yellow-500/10 px-3 py-1.5 rounded-xl">
                                    <i data-lucide="star" class="w-4 h-4 text-yellow-500 fill-yellow-500"></i>
                                    <span class="text-sm font-black text-yellow-700 dark:text-yellow-500">${hotel.rating}</span>
                                </div>
                            </div>
                            
                            <div class="flex flex-wrap gap-2 mb-8">
                                ${hotel.amenities.map(a => `<span class="px-3 py-1 bg-gray-100 dark:bg-white/5 rounded-lg text-[10px] font-bold text-gray-500 uppercase">${a}</span>`).join('')}
                            </div>

                            <div class="flex items-center justify-between pt-6 border-t border-gray-50 dark:border-white/5">
                                <div>
                                    <span class="text-3xl font-black text-primary">$${hotel.price}</span>
                                    <span class="text-gray-400 text-xs font-bold"> / night</span>
                                </div>
                                <button onclick="openBooking(${hotel.id}, 'hotel')" class="px-8 py-4 bg-dark dark:bg-white text-white dark:text-dark rounded-2xl font-black hover:bg-primary hover:text-white transition-all shadow-lg">
                                    Book Now
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
