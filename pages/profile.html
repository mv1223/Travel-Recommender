<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile | TravelAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#0066FF', accent: '#FF385C', dark: '#1D1D1F' },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-[#F5F5F7] dark:bg-dark text-dark dark:text-white font-sans min-h-screen page-fade-in">

    <nav id="navbar" class="sticky top-0 z-50 py-4 px-6"></nav>

    <main class="container mx-auto px-6 py-16 max-w-4xl">
        <header class="mb-16 flex items-center gap-8">
            <div class="w-24 h-24 bg-primary rounded-3xl flex items-center justify-center text-4xl font-black text-white shadow-xl shadow-primary/30" id="profile-initial">JD</div>
            <div>
                <h1 class="text-5xl font-black mb-2" id="profile-name">John Doe</h1>
                <p class="text-gray-400 font-bold" id="profile-email">john.doe@example.com</p>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-12">
            <!-- Sidebar Tabs -->
            <div class="space-y-4">
                <button class="w-full text-left px-8 py-5 rounded-2xl bg-primary text-white font-black shadow-lg shadow-primary/20 transition-all">
                    Personal Info
                </button>
                <button class="w-full text-left px-8 py-5 rounded-2xl bg-white dark:bg-white/5 font-bold text-gray-400 hover:text-dark dark:hover:text-white transition-all">
                    Security
                </button>
                <button class="w-full text-left px-8 py-5 rounded-2xl bg-white dark:bg-white/5 font-bold text-gray-400 hover:text-dark dark:hover:text-white transition-all">
                    Preferences
                </button>
                <button onclick="AppState.logout()" class="w-full text-left px-8 py-5 rounded-2xl bg-red-50 text-accent font-black hover:bg-accent hover:text-white transition-all">
                    Logout
                </button>
            </div>

            <!-- Content Area -->
            <div class="md:col-span-2 bg-white dark:bg-white/5 rounded-[40px] p-10 shadow-sm border border-gray-100 dark:border-white/10">
                <h3 class="text-2xl font-black mb-8">Personal Information</h3>
                <div class="space-y-6">
                    <div class="grid grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Full Name</label>
                            <input type="text" id="edit-name" class="w-full px-6 py-4 rounded-xl bg-gray-50 dark:bg-white/5 border-none font-bold">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Phone Number</label>
                            <input type="text" value="+1 234 567 890" class="w-full px-6 py-4 rounded-xl bg-gray-50 dark:bg-white/5 border-none font-bold">
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Email Address</label>
                        <input type="email" id="edit-email" class="w-full px-6 py-4 rounded-xl bg-gray-50 dark:bg-white/5 border-none font-bold">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Travel Style</label>
                        <div class="flex flex-wrap gap-2">
                            <span class="px-4 py-2 bg-primary/10 text-primary rounded-xl text-xs font-black">Luxury</span>
                            <span class="px-4 py-2 bg-primary/10 text-primary rounded-xl text-xs font-black">Beach</span>
                            <span class="px-4 py-2 bg-gray-50 dark:bg-white/5 rounded-xl text-xs font-black">Adventure</span>
                            <button class="w-8 h-8 rounded-lg bg-gray-100 dark:bg-white/5 flex items-center justify-center text-gray-400 hover:bg-primary hover:text-white transition-all">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="pt-10">
                        <button onclick="updateProfile()" class="px-12 py-5 bg-primary text-white rounded-[24px] font-black text-lg shadow-xl shadow-primary/20 hover:scale-[1.02] transition-transform">
                            Save Changes
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../data/app_state.js"></script>
    <script src="../components/navbar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = AppState.getUser();
            if (!user) {
                window.location.href = '../index.html';
                return;
            }

            Navbar.render('profile');
            
            document.getElementById('profile-name').innerText = user.name;
            document.getElementById('profile-email').innerText = user.email;
            document.getElementById('profile-initial').innerText = user.name.charAt(0).toUpperCase();
            
            document.getElementById('edit-name').value = user.name;
            document.getElementById('edit-email').value = user.email;
            
            lucide.createIcons();
        });

        function updateProfile() {
            const name = document.getElementById('edit-name').value;
            const email = document.getElementById('edit-email').value;
            
            AppState.setUser({ name, email, id: Date.now() });
            AppState.addNotification("Profile Updated", "Your information has been successfully saved.");
            
            location.reload();
        }
    </script>
</body>
</html>
